[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucsa"
version = "0.1.0"
description = "UCSA-R: a causal, windowed language model with a persistent state, evaluated by compression."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "sachin", email = "sachncs@gmail.com" }]
keywords = ["language-model", "compression", "pytorch", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://sachncs.github.io/ucsa/"
Repository = "https://github.com/sachncs/ucsa"
Issues = "https://github.com/sachncs/ucsa/issues"
Discussions = "https://github.com/sachncs/ucsa/discussions"
Changelog = "https://github.com/sachncs/ucsa/blob/master/CHANGELOG.md"

[tool.setuptools]
packages = [
    "ucsa",
    "ucsa.models",
    "ucsa.training",
    "ucsa.utils",
]

[tool.setuptools.package-data]
ucsa = ["config.yaml"]

[tool.ruff]
line-length = 80
target-version = "py314"
src = ["ucsa", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "YTT", # flake8-2020
    "PT",  # flake8-pytest-style
]
ignore = [
    "E501", # line length is enforced by `ruff format`
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011"]  # pytest.raises without match is OK in our style
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["ucsa"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = false
check_untyped_defs = false
ignore_missing_imports = true
plugins = []
exclude = ["build/", "dist/", ".venv/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ucsa"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]