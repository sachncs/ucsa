[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucsa"
version = "0.1.0"
description = "Unified Cognitive State Architecture: a research-grade foundation model whose computation revolves around a single persistent differentiable cognitive state."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "sachin", email = "sachncs@gmail.com" }]
keywords = ["cognitive-architecture", "pytorch", "research", "foundation-model"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "accelerate>=0.27.0",
    "safetensors>=0.4.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "tensorboard>=2.15.0",
    "wandb>=0.16.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "types-PyYAML",
]

[project.scripts]
ucsa-train = "ucsa.train:main"
ucsa-infer = "ucsa.infer:main"

[project.urls]
Homepage = "https://github.com/anomalyco/ucsa"

[tool.setuptools]
packages = [
    "ucsa",
    "ucsa.models",
    "ucsa.training",
    "ucsa.utils",
]

[tool.setuptools.package-data]
ucsa = ["configs/*.yaml"]