# Stricter lint for the UCSA-R code path, following the Google Python Style
# Guide: docstrings (Google convention), PEP 8 naming, type annotations.
# Run: ruff check --config ruff-strict.toml <files in STRICT_FILES>
line-length = 80
target-version = "py314"

[lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RET", "C4", "D", "N", "ANN", "PT"]
ignore = [
    "D203", "D212", "D213", "D415", "D416", # conflicting / redundant docstring variants
    "ANN401",                                # Any is used for heterogeneous dicts
    "B008",
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/*" = ["D", "ANN", "PT011"]
"scripts/*" = ["T201"]
