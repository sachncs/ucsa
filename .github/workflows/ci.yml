name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (Google style, naming, types)
        run: ruff check .
      - name: Format
        run: ruff format --check ucsa scripts tests
      - name: Test
        run: pytest -q
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
