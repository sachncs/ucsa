# UCSA-R configuration: the single file.
#
# A preset is a `model` section (fields of `recurrent.Config`) and a `train`
# section (fields of `engine.Config`). Select one with
# `scripts/train_r.py --preset <name>` and override any field with
# `--set model.chunk_size=64 train.lr=3e-4`. Unknown fields are rejected.
presets:
  tiny:       # CPU smoke tests
    model: {hidden: 64, layers: 2, heads: 4, ffn_dim: 128, chunk_size: 32,
            banks: {working: 8, long_term: 4},
            bank_write_bias: {working: 0.0, long_term: -2.0}}
    train: {steps: 50, seq_len: 128, warmup_steps: 5, eval_every: 25,
            eval_batches: 2, log_every: 10}
  small:      # ~19M parameters: compute-optimal for ~100M tokens
    # read_gate: 0.06-0.09 bits/token better than no gate; jepa_weight 0: JEPA
    # gave no gain beyond noise; lr 2.4e-3 chosen by the ladder crossover.
    model: {hidden: 256, layers: 6, heads: 4, ffn_dim: 704, chunk_size: 128,
            read_gate: true, jepa_weight: 0.0}
    train: {steps: 12000, seq_len: 1024, lr: 2.4e-3}
  base:
    model: {hidden: 768, layers: 12, heads: 12, ffn_dim: 2048, chunk_size: 128,
            banks: {working: 32, long_term: 16, intent: 16}}
    train: {steps: 30000, seq_len: 1024, lr: 4.0e-4, grad_accum: 4}
