<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="540" height="280" role="img" aria-label="UCSA architecture overview">
  <title>UCSA architecture — PCS at center, surrounded by operator, memory, heads, losses</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="540" height="280" rx="12" fill="#ffffff"/>

  <!-- Central PCS -->
  <g transform="translate(270 140)">
    <circle cx="0" cy="0" r="56" fill="#fbfbfb" stroke="#0a2540" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
      font-size="13" font-weight="700" fill="#0a2540">PCS</text>
    <text x="0" y="10" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace"
      font-size="9" letter-spacing="1.5" fill="#5b6470">7 BANKS</text>
    <!-- inner dots -->
    <g fill="#1d4ed8">
      <circle cx="-12" cy="22" r="2.5"/>
      <circle cx="0" cy="24" r="2.5"/>
      <circle cx="12" cy="22" r="2.5"/>
    </g>
  </g>

  <!-- Surrounding nodes -->
  <g font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">

    <!-- Perception (top) -->
    <g transform="translate(220 36)">
      <rect x="0" y="0" width="100" height="40" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
      <text x="50" y="18" text-anchor="middle" fill="#1d4ed8">Perception</text>
      <text x="50" y="32" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="9" letter-spacing="1.2" fill="#1d4ed8">tokenize → embed</text>
    </g>
    <line x1="270" y1="76" x2="270" y2="84" stroke="#5b6470" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Reasoning loop (right) -->
    <g transform="translate(380 96)">
      <rect x="0" y="0" width="120" height="50" rx="6" fill="#ccfbf1" stroke="#0f766e"/>
      <text x="60" y="20" text-anchor="middle" fill="#0f766e">Reasoning loop</text>
      <text x="60" y="36" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="9" letter-spacing="1.2" fill="#0f766e">F · N=4 iter</text>
    </g>
    <line x1="324" y1="140" x2="380" y2="140" stroke="#5b6470" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Memory service (bottom-right) -->
    <g transform="translate(380 200)">
      <rect x="0" y="0" width="120" height="44" rx="6" fill="#fef3c7" stroke="#a16207"/>
      <text x="60" y="18" text-anchor="middle" fill="#a16207">Memory service</text>
      <text x="60" y="32" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="9" letter-spacing="1.2" fill="#a16207">verify · consolidate</text>
    </g>
    <line x1="380" y1="160" x2="324" y2="180" stroke="#5b6470" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.6"/>

    <!-- Projection heads (left) -->
    <g transform="translate(40 96)">
      <rect x="0" y="0" width="120" height="50" rx="6" fill="#ede9fe" stroke="#6d28d9"/>
      <text x="60" y="20" text-anchor="middle" fill="#6d28d9">Projection heads</text>
      <text x="60" y="36" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="9" letter-spacing="1.2" fill="#6d28d9">lang · plan · tool · memory</text>
    </g>
    <line x1="160" y1="140" x2="214" y2="140" stroke="#5b6470" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Auxiliary losses (bottom-left) -->
    <g transform="translate(40 200)">
      <rect x="0" y="0" width="120" height="44" rx="6" fill="#fce7f3" stroke="#be185d"/>
      <text x="60" y="18" text-anchor="middle" fill="#be185d">Auxiliary losses</text>
      <text x="60" y="32" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="9" letter-spacing="1.2" fill="#be185d">JEPA · recon · router</text>
    </g>
    <line x1="214" y1="180" x2="160" y2="160" stroke="#5b6470" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.6"/>

    <!-- Eval harness (top-left) -->
    <g transform="translate(40 36)">
      <rect x="0" y="0" width="100" height="40" rx="6" fill="#f1f5f9" stroke="#475569"/>
      <text x="50" y="18" text-anchor="middle" fill="#475569">Eval harness</text>
      <text x="50" y="32" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace"
        font-size="9" letter-spacing="1.2" fill="#475569">HellaSwag · ARC · PIQA</text>
    </g>
  </g>

  <!-- Footer caption -->
  <text x="270" y="270" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace"
    font-size="10" fill="#8b95a1">everything reads from or writes to the PCS</text>
</svg>
